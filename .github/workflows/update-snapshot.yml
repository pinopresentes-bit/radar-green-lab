name: Green Lab - atualizar placares
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: green-lab-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Consultar placares públicos
        run: python scripts/update_snapshot.py
      - name: Salvar snapshot somente se mudou
        run: |
          git config user.name "green-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: atualizar snapshot de placares"
            git push
          fi
